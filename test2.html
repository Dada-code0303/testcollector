<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传与管理</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .upload-section input[type="file"] {
            padding: 10px;
            margin-right: 10px;
        }
        .upload-section input[type="text"] {
            padding: 10px;
            width: 200px;
        }
        .upload-section button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .upload-section button:hover {
            background-color: #45a049;
        }
        .file-list {
            margin-top: 20px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background-color: #fff;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .file-item button {
            padding: 5px 10px;
            background-color: #f44336;
            color: white;
            border: none;
            cursor: pointer;
        }
        .file-item button:hover {
            background-color: #e53935;
        }
        .file-item img {
            max-width: 50px;
            max-height: 50px;
            margin-right: 10px;
        }
        .file-item .file-info {
            display: flex;
            flex-direction: column;
        }
        /* 文件预览框样式 */
        .preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .preview-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 80%;
            max-height: 80%;
            overflow: auto;
            position: relative;
        }
        .close-preview {
            background-color: #f44336;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .preview-image-container {
            width: 100%;
            height: auto;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        .preview-image {
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 80vh; /* 确保图片的最大高度为80%视口高度 */
        }
        /* 修改查看按钮的样式为蓝色 */
        .view-button {
            padding: 5px 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }
        .view-button:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>文件上传与管理</h1>

    <!-- 文件上传和标签输入区 -->
    <div class="upload-section">
        <input type="file" id="fileInput" multiple>
        <input type="text" id="tagsInput" placeholder="输入标签，用逗号分隔">
        <button id="uploadButton">上传文件</button>
    </div>

    <!-- 已上传文件列表 -->
    <div class="file-list" id="fileList">
        <!-- 文件项将在这里显示 -->
    </div>
</div>

<!-- 文件预览框 -->
<div class="preview-overlay" id="previewOverlay">
    <div class="preview-content" id="previewContent">
        <button class="close-preview" id="closePreviewBtn">关闭</button>
        <div class="preview-image-container" id="previewImageContainer">
            <img id="previewImage" class="preview-image" />
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const tagsInput = document.getElementById('tagsInput');
    const uploadButton = document.getElementById('uploadButton');
    const fileList = document.getElementById('fileList');
    const previewOverlay = document.getElementById('previewOverlay');
    const previewImage = document.getElementById('previewImage');
    const closePreviewBtn = document.getElementById('closePreviewBtn');

    let uploadedFiles = [];

    // 处理文件上传
    uploadButton.addEventListener('click', function () {
        const files = fileInput.files;
        const tags = tagsInput.value.trim().split(',');

        if (files.length > 0 && tags.length > 0) {
            Array.from(files).forEach(file => {
                const fileObject = {
                    file: file,
                    tags: tags,
                    previewUrl: URL.createObjectURL(file),
                };
                uploadedFiles.push(fileObject);
                displayFiles();
            });
        } else {
            alert('请上传文件并输入标签');
        }

        // 清空输入框
        fileInput.value = '';
        tagsInput.value = '';
    });

    // 显示上传的文件列表
    function displayFiles() {
        fileList.innerHTML = '';
        uploadedFiles.forEach((fileObject, index) => {
            const fileItem = document.createElement('div');
            fileItem.classList.add('file-item');

            const fileInfo = document.createElement('div');
            fileInfo.classList.add('file-info');
            fileInfo.innerHTML = `
                <strong>${fileObject.file.name}</strong>
                <small>标签: ${fileObject.tags.join(', ')}</small>
            `;

            const filePreview = document.createElement('img');
            if (fileObject.file.type.startsWith('image')) {
                filePreview.src = fileObject.previewUrl;
            }

            const viewButton = document.createElement('button');
            viewButton.textContent = '查看';
            viewButton.classList.add('view-button');
            viewButton.addEventListener('click', () => {
                viewFile(fileObject);
            });

            const deleteButton = document.createElement('button');
            deleteButton.textContent = '删除';
            deleteButton.addEventListener('click', () => {
                uploadedFiles.splice(index, 1);
                displayFiles();
            });

            fileItem.appendChild(filePreview);
            fileItem.appendChild(fileInfo);
            fileItem.appendChild(viewButton);
            fileItem.appendChild(deleteButton);
            fileList.appendChild(fileItem);
        });
    }

    // 查看文件的函数
    function viewFile(fileObject) {
        const file = fileObject.file;
        const fileType = file.type;

        previewImage.src = fileObject.previewUrl;

        // 显示预览框
        previewOverlay.style.display = 'flex';
    }

    // 关闭预览框
    closePreviewBtn.addEventListener('click', () => {
        previewOverlay.style.display = 'none';
    });
</script>

</body>
</html>
